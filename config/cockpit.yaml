# Engine settings. Everything here is safe to change without code changes.
# dataDir: ~/.agent-cockpit           # SQLite DB, worktrees, traces, snapshot (env COCKPIT_DATA_DIR)
maxParallelTasks: 4
review:
  maxIterations: 3                   # worker -> lead review loop before escalating to the council
decisions:
  maxRounds: 2                       # lead <-> council proposal rounds before planning
  duringTasks: defer                 # defer: the council rules on review proposals once, at final validation; immediate: a call per review
validation:
  maxRevisions: 1                    # council "revise" rounds before presenting to the human
team:
  approval: true                     # the head lead's worker team waits for your approval before any worker starts
agentTimeoutMs: 2700000
testTimeoutMs: 900000
finalMerge: merge                    # merge | branch (leave the integration branch for the human)
telemetry:
  fileExport: true                   # <dataDir>/traces/spans-*.jsonl
  otlpEndpoint: null                 # e.g. http://localhost:4318/v1/traces (Tempo / Jaeger)
transport:
  port: 0                            # 0 = random free port, published in <dataDir>/daemon.json
