<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #060a08; }
  svg { display: block; font-family: "JetBrains Mono", ui-monospace, monospace; }
  .t { fill: #eafff2; font-size: 17px; font-weight: 700; }
  .s { fill: #8aa595; font-size: 13px; }
  .lbl { fill: #8aa595; font-size: 13px; }
  .num { fill: #4ade80; font-size: 22px; font-weight: 800; }
  .step { fill: #eafff2; font-size: 15px; font-weight: 800; letter-spacing: .06em; }
  .tier { font-size: 12px; font-weight: 800; letter-spacing: .12em; }
  .wire { stroke: #3b5a47; stroke-width: 2; fill: none; }
  .back { stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
</style></head>
<body>
<svg width="1600" height="740" viewBox="0 0 1600 740">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b5a47"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#4ade80" stop-opacity=".10"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="740" fill="url(#glow)"/>
  <rect x="1" y="1" width="1598" height="738" rx="10" fill="none" stroke="#1f4a30"/>

  <!-- steps, left -->
  <g>
    <text x="40" y="76" class="num">01</text><text x="86" y="74" class="step">BRIEF</text><text x="86" y="94" class="s">you describe the mission</text>
    <text x="40" y="224" class="num">02</text><text x="86" y="222" class="step">ARCHITECTURE</text><text x="86" y="242" class="s">the chair designs,</text><text x="86" y="260" class="s">members review it</text>
    <text x="40" y="386" class="num">03</text><text x="86" y="384" class="step">PLAN + TEAM</text><text x="86" y="404" class="s">the head lead names</text><text x="86" y="422" class="s">the workers; you approve</text>
    <text x="40" y="556" class="num">04</text><text x="86" y="554" class="step">BUILD</text><text x="86" y="574" class="s">in parallel, one git</text><text x="86" y="592" class="s">worktree per task</text>
    <text x="40" y="686" class="num">05</text><text x="86" y="684" class="step">REVIEW → MERGE</text><text x="86" y="704" class="s">lead review, integration,</text><text x="86" y="722" class="s">council validation, you</text>
  </g>

  <!-- wires, down the hierarchy -->
  <path class="wire" d="M860 96 V166" marker-end="url(#a)"/>
  <text x="872" y="138" class="lbl">mission brief</text>
  <path class="wire" d="M860 262 V300 H640 V336" marker-end="url(#a)"/>
  <path class="wire" d="M860 300 H1080 V336" marker-end="url(#a)"/>
  <text x="872" y="292" class="lbl">architecture</text>
  <path class="wire" d="M640 420 V465 H520 V506" marker-end="url(#a)"/>
  <path class="wire" d="M640 465 H740 V506" marker-end="url(#a)"/>
  <path class="wire" d="M1080 420 V506" marker-end="url(#a)"/>
  <text x="652" y="458" class="lbl">tasks</text><text x="1092" y="470" class="lbl">tasks</text>

  <!-- the team goes to you before anyone builds -->
  <path class="back" stroke="#facc15" d="M466 380 H430 V68 H756" marker-end="url(#ay)"/>
  <text x="422" y="224" class="lbl" fill="#facc15" transform="rotate(-90 422 224)" text-anchor="middle" style="fill:#facc15">plan + named team · you approve</text>

  <!-- the work comes back up -->
  <path class="back" stroke="#4ade80" d="M1184 550 H1330 V68 H964" marker-end="url(#ag)"/>
  <g style="fill:#8aa595;font-size:13px">
    <text x="1346" y="520">↑ diff + tests</text>
    <text x="1346" y="446">↑ lead review</text>
    <text x="1346" y="372">↑ integration + tests</text>
    <text x="1346" y="216">↑ council validates</text>
    <text x="1346" y="100" style="fill:#4ade80;font-weight:700">↑ you approve the merge</text>
  </g>

  <!-- YOU -->
  <rect x="760" y="40" width="200" height="56" rx="8" fill="#3a3008" stroke="#facc15"/>
  <text x="860" y="66" class="t" text-anchor="middle">◉ YOU</text>
  <text x="860" y="85" class="s" text-anchor="middle">brief · approvals</text>

  <!-- council -->
  <rect x="560" y="170" width="600" height="92" rx="8" fill="#0b1710" stroke="#a78bfa"/>
  <text x="576" y="192" class="tier" fill="#a78bfa" style="fill:#a78bfa">◆ SUPERVISOR COUNCIL</text>
  <rect x="580" y="204" width="270" height="44" rx="6" fill="#2e2160" stroke="#a78bfa"/>
  <text x="596" y="226" class="t">★ opus</text><text x="596" y="241" class="s">chair · ⚡high</text>
  <rect x="870" y="204" width="270" height="44" rx="6" fill="#2e2160" stroke="#6d5bb0"/>
  <text x="886" y="226" class="t">codex</text><text x="886" y="241" class="s">member · ⚡medium</text>

  <!-- leads -->
  <text x="470" y="332" class="tier" style="fill:#22d3ee">◇ LEADS</text>
  <rect x="470" y="340" width="340" height="80" rx="8" fill="#0c3a44" stroke="#22d3ee"/>
  <text x="488" y="368" class="t">★ codex · backend</text><text x="488" y="388" class="s">⚡high · plans, staffs,</text><text x="488" y="405" class="s">reviews, integrates</text>
  <rect x="910" y="340" width="340" height="80" rx="8" fill="#0c3a44" stroke="#1a8fa3"/>
  <text x="928" y="368" class="t">sonnet · frontend</text><text x="928" y="388" class="s">⚡medium · answers and</text><text x="928" y="405" class="s">reviews its own tasks</text>

  <!-- workers -->
  <text x="420" y="502" class="tier" style="fill:#fb923c">◈ WORKERS</text>
  <rect x="420" y="510" width="200" height="80" rx="8" fill="#1d150b" stroke="#fb923c"/>
  <text x="436" y="538" class="t">backend-dev</text><text x="436" y="558" class="s">sonnet · ⚡high</text><text x="436" y="576" class="s">own worktree</text>
  <rect x="640" y="510" width="200" height="80" rx="8" fill="#1d150b" stroke="#f472b6"/>
  <text x="656" y="538" class="t">tester</text><text x="656" y="558" class="s">haiku · ⚡low</text><text x="656" y="576" class="s">own worktree</text>
  <rect x="980" y="510" width="200" height="80" rx="8" fill="#1d150b" stroke="#60a5fa"/>
  <text x="996" y="538" class="t">ui-dev</text><text x="996" y="558" class="s">sonnet · ⚡medium</text><text x="996" y="576" class="s">own worktree</text>

  <!-- guarantees -->
  <rect x="420" y="630" width="760" height="70" rx="8" fill="#08110c" stroke="#1f4a30"/>
  <text x="440" y="658" style="fill:#4ade80;font-size:13px;font-weight:800;letter-spacing:.1em">ENFORCED BY THE ORCHESTRATOR</text>
  <text x="440" y="682" class="s">isolated worktrees · file leases · failing tests never approved · nothing merges without you</text>
</svg>
</body></html>
